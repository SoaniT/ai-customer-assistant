[project]
name = "ai-customer-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "bs4>=0.0.2",
    "fastapi>=0.140.13",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "markdownify>=1.2.3",
    "minio>=7.2.20",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "trafilatura>=2.2.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai-customer-assistant"]
